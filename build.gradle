buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'ca.cutterslade.gradle:gradle-dependency-analyze:2.0.0'
    }
}

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
}

apply plugin: 'ca.cutterslade.analyze'

group 'org.LostCityMapEditor'
version '3.7'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.0'
}

sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'org.lostcitymapeditor'
    mainClass = 'org.lostcitymapeditor.LostCityMapEditor'
    applicationDefaultJvmArgs = [
            '--add-opens', 'javafx.graphics/javafx.scene.effect=com.gluonhq.attach.util',
            '--add-exports', 'javafx.graphics/javafx.scene.effect=ALL-UNNAMED'
    ]
}

// Extract only the current platform's LWJGL natives (avoids x86_64 on arm64 Mac)
def lwjglNativesDir = layout.buildDirectory.dir('lwjgl-natives')
def osArch = System.getProperty("os.arch", "").toLowerCase()
def osName = System.getProperty("os.name", "").toLowerCase()
def isMacArm64 = osName.contains("mac") && (osArch == "aarch64" || osArch == "arm64")
def nativesFilter = { File f ->
    if (!f.name.contains("natives") || !f.name.contains("lwjgl")) return false
    if (osName.contains("mac")) return isMacArm64 ? f.name.contains("natives-macos-arm64") : (f.name.contains("natives-macos") && !f.name.contains("arm64"))
    if (osName.contains("win")) return f.name.contains("natives-windows")
    if (osName.contains("linux")) return f.name.contains("natives-linux")
    return true
}
task extractLwjglNatives(type: Copy) {
    doFirst {
        def dir = file("${buildDir}/lwjgl-natives")
        if (dir.exists()) dir.deleteDir()
    }
    from {
        configurations.runtimeClasspath.filter(nativesFilter).collect { zipTree(it) }
    }
    into lwjglNativesDir
    include '**/*.dylib', '**/*.so', '**/*.dll'
    eachFile { details ->
        details.path = details.name
    }
    includeEmptyDirs = false
}

def lwjglNativesPath = file("${buildDir}/lwjgl-natives").absolutePath
application.applicationDefaultJvmArgs.addAll([
    "-Djava.library.path=${lwjglNativesPath}",
    "-Dorg.lwjgl.librarypath=${lwjglNativesPath}"
])
// macOS dual-process: the launcher spawns the renderer child with -XstartOnFirstThread.
// Do NOT add it to applicationDefaultJvmArgs — the launcher JVM must NOT have it.

// Script for macOS directory chooser subprocess (no -XstartOnFirstThread so the dialog can open)
def chooserScript = file("${buildDir}/chooser.sh")
task createChooserScript {
    doLast {
        chooserScript.parentFile.mkdirs()
        def cp = configurations.runtimeClasspath.asPath.replace('"', '\\"')
        def javaHome = System.getProperty('java.home').replace('"', '\\"')
        chooserScript.text = "#!/bin/sh\nCP=\"${cp}\"\nJAVA_HOME=\"${javaHome}\"\nexec \"\${JAVA_HOME}/bin/java\" -cp \"\$CP\" org.lostcitymapeditor.DirectoryChooserMain\n"
        chooserScript.setExecutable(true)
    }
}

// Ensure run uses full runtime classpath and LWJGL natives.
// Pass -Dserver.dir=... from command line to set server data path without the chooser.
tasks.named('run').configure {
    dependsOn extractLwjglNatives, createChooserScript
    classpath = sourceSets.main.runtimeClasspath
    modularity.inferModulePath.set(true)
    if (System.getProperty('server.dir') != null) {
        systemProperty 'server.dir', System.getProperty('server.dir')
    }
    if (osName.contains("mac")) {
        systemProperty 'server.chooser.script', chooserScript.absolutePath
    }
}

javafx {
    version = '21.0.7'
    modules = ['javafx.controls', 'javafx.swing']
}

project.ext.lwjglVersion = "3.3.6"
project.ext.lwjglNativesWindows = "natives-windows"
project.ext.lwjglNativesLinux = "natives-linux"
project.ext.lwjglNativesMac = "natives-macos"
project.ext.lwjglNativesMacArm64 = "natives-macos-arm64"

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.joml:joml:1.10.5")
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNativesWindows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNativesWindows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNativesWindows"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNativesLinux"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNativesLinux"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNativesLinux"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNativesMac"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNativesMac"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNativesMac"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNativesMacArm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNativesMacArm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNativesMacArm64"
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'org.lostcitymapeditor.LostCityMapEditor'
    }

    // Include all dependencies in the JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Handle duplicate files
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'LostCityMapEditor'
        jvmArgs = ['-Djava.library.path=$APPDIR/lib']
    }

    addExtraDependencies("javafx")
    addExtraDependencies("lwjgl")

    forceMerge("javafx")
    forceMerge("lwjgl")
}

jlinkZip {
    group = 'distribution'
}

task createDistribution(type: Zip, dependsOn: [build, jlinkZip]) {
    archiveFileName = "LostCityMapEditor-${version}-distribution.zip"
    destinationDirectory = file("${buildDir}/distributions")

    from jar
    from "${buildDir}/image"
}